[package]
name = "clairic"
version = "0.1.0"
edition = "2024"

[lib]
name = "clairic"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dotenvy = "0.15.7"
imap = "2.4.1"
mail-parser = "0.11.9"
native-tls = "0.2.18"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
